name: iOS build (unsigned IPA for sideloading)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: |
          set -o pipefail
          (flutter analyze lib --no-fatal-infos --no-fatal-warnings | tee analyze.log) || true
          if grep -qE '^[[:space:]]*(error|warning)[[:space:]]*[-•]' analyze.log; then
            echo "::error::flutter analyze reported errors or warnings"
            grep -E '^[[:space:]]*(error|warning)[[:space:]]*[-•]' analyze.log
            exit 1
          fi

      - name: Test
        run: flutter test --exclude-tags golden

  build:
    name: Build unsigned IPA
    needs: verify
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Pre-cache iOS artifacts
        run: flutter precache --ios

      # Without this the IPA ships with no Maps key at all: MapsKeys.xcconfig
      # is gitignored, so the placeholder in Info.plist stays literal,
      # provideAPIKey is never called, and the Google Maps SDK throws the
      # moment a map view is created — the app quits on the Map tab. The key
      # is a repo secret rather than a file in the tree because this
      # repository is public.
      - name: Write the Google Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::GOOGLE_MAPS_API_KEY secret is empty — the map would crash the app"
            exit 1
          fi
          printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" \
            > ios/Flutter/MapsKeys.xcconfig
          echo "key written, ${#GOOGLE_MAPS_API_KEY} chars"

      - name: Check Runner Swift sources are in the build phase
        run: |
          set -e
          missing=0
          for f in ios/Runner/*.swift; do
            name=$(basename "$f")
            if ! grep -q "$name in Sources" ios/Runner.xcodeproj/project.pbxproj; then
              echo "::error file=$f::$name is missing from the Runner target's Sources build phase"
              missing=1
            fi
          done
          exit $missing

      # The Podfile is generated by the tool on first build and is not in the
      # repository, so the platform line it writes comes from whatever default
      # Flutter picks — not from the Xcode project. Google Maps needs iOS 15,
      # and CocoaPods refuses the whole install when a pod asks for more than
      # the platform states. Stating it here keeps the two in step with
      # IPHONEOS_DEPLOYMENT_TARGET without checking a generated file in.
      - name: Pin the CocoaPods platform to iOS 15
        run: |
          set -e
          cd ios
          if [ ! -f Podfile ]; then
            flutter build ios --release --no-codesign --config-only || true
          fi
          grep -v "^platform :ios" Podfile > Podfile.pinned
          printf "platform :ios, '15.0'\n" | cat - Podfile.pinned > Podfile
          rm -f Podfile.pinned
          head -3 Podfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/iphoneos
          if [ ! -d Runner.app ]; then
            echo "Runner.app missing — flutter build did not produce a .app"
            exit 1
          fi
          rm -rf Payload cubechat-unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr cubechat-unsigned.ipa Payload
          ls -lh cubechat-unsigned.ipa

      - name: Publish IPA to rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: Latest unsigned IPA (${{ github.ref_name }})
          prerelease: true
          body: |
            Auto-built **unsigned** IPA for sideloading on iOS.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`

            Download `cubechat-unsigned.ipa` below and sideload it with Sideloadly or AltStore.
          files: build/ios/iphoneos/cubechat-unsigned.ipa

      - name: Upload IPA as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cubechat-ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/cubechat-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ iOS build succeeded"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Download:** \`${{ github.server_url }}/${{ github.repository }}/releases/tag/ipa-latest\`"
            echo ""
            echo "### Install on iPhone"
            echo "1. Download \`cubechat-unsigned.ipa\` from the release above"
            echo "2. Open Sideloadly or AltStore"
            echo "3. Sideload the IPA with your Apple ID"
            echo "4. Trust the profile in iPhone Settings if needed"
          } >> "$GITHUB_STEP_SUMMARY"
