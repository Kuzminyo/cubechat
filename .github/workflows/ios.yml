name: iOS build (unsigned IPA for sideloading)

# Triggers:
# - every push to main (so each commit produces a fresh IPA)
# - manual run from the Actions tab (Run workflow button)
#
# Add a feature branch to the list below to get device builds off it without
# merging first — and take it back out when it merges, or its pushes keep
# overwriting the ipa-latest release with a build that isn't main's. (That
# caveat used to not apply here: this job only produced a per-SHA artifact
# until the artifact storage allowance ran out.)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to upsert the rolling "ipa-latest" prerelease the IPA is delivered
# through — see the publish step for why it is not a workflow artifact.
permissions:
  contents: write

jobs:
  # Deliberately on Ubuntu, not on the macOS runner below. The tests are
  # platform-agnostic, and macOS minutes bill at 10× — so gating here costs a
  # couple of ordinary minutes and saves an expensive build on a tree that was
  # never going to be worth shipping. See android.yml for why --no-fatal-infos.
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build:
    name: Build unsigned IPA
    needs: verify
    # GitHub-hosted macOS runner — 10× minute multiplier but public repos
    # get unlimited minutes, private repos get 200 free macOS minutes/month.
    # macos-15 ships Xcode 16 (iOS 18 SDK); the macos-14 default Xcode 15 lacks
    # the AVCaptureSession.runtimeErrorNotification / .wasInterruptedNotification
    # members that camera_avfoundation 0.10.2 compiles against, which failed the
    # build outright.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Xcode explicitly so a runner-image default bump can't silently drop
      # us back onto an SDK too old for the camera plugin. latest-stable = the
      # newest non-beta Xcode on the image (16.x on macos-15).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Pin Flutter to match the developer's local stable channel.
      # The iOS scaffolding (AppDelegate.swift / SceneDelegate.swift) was
      # generated by Flutter 3.41 and uses FlutterImplicitEngineBridge /
      # FlutterImplicitEngineDelegate / FlutterSceneDelegate — types that
      # don't exist on older Flutter SDKs. Pinning 3.41.x keeps CI and
      # the developer machine on the same APIs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Pre-cache iOS artifacts
        run: flutter precache --ios

      # Every Swift file in ios/Runner has to be in the Runner target's Sources
      # phase, and nothing checks that on its own. This project has hand-written
      # plugins whose entries in project.pbxproj were added by hand (there is no
      # Mac in the loop for most of the work), and getting one wrong does not
      # fail the build — the class is simply never compiled in. The app installs,
      # the channel answers MissingPluginException, and the feature quietly does
      # the fallback thing forever. That is a lot of a sideload cycle to spend on
      # a missing line, so it is caught here in a second.
      - name: Check every Runner source is actually built
        run: |
          set -e
          missing=0
          for f in ios/Runner/*.swift; do
            name=$(basename "$f")
            if ! grep -q "$name in Sources" ios/Runner.xcodeproj/project.pbxproj
            then
              echo "::error file=$f::$name is missing from the Runner target's Sources build phase"
              missing=1
            fi
          done
          exit $missing

      # Build the unsigned .app bundle. `flutter build ipa --no-codesign`
      # only produces an .xcarchive (not an .ipa) because IPA packaging
      # normally happens via xcodebuild -exportArchive which requires a
      # signing identity. So we build with `flutter build ios` and then
      # manually wrap the resulting Runner.app in the Payload/ directory
      # convention that .ipa files use, and zip it. Sideloadly / AltStore
      # accept this format and re-sign with the user's free Apple ID.
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Show build output
        run: |
          set -e
          echo "build/ios/iphoneos:"
          ls -lh build/ios/iphoneos/ || echo "(missing)"

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/iphoneos
          if [ ! -d Runner.app ]; then
            echo "Runner.app missing — flutter build did not produce a .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr cubechat-unsigned.ipa Payload
          ls -lh cubechat-unsigned.ipa

      # Delivered through a release, not an artifact.
      #
      # This repo is private, so Actions artifact storage is a small fixed
      # allowance, and it filled up: the build compiled an IPA, packaged it,
      # and then had nowhere to put it. Pruning got real usage from 7.5 GB down
      # to 47 MB and the upload still failed, because the quota is recalculated
      # only every 6-12 hours — so an accounting delay could block iOS builds
      # for half a day at a time.
      #
      # A release asset does not draw on that allowance at all, and it is how
      # the Android job has always shipped its APK: one stable URL, no zip
      # around it, nothing to expire. The artifact upload is kept as a
      # convenience but must never fail the build again.
      - name: Publish IPA to the rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ipa-latest
          name: Latest unsigned IPA (${{ github.ref_name }})
          prerelease: true
          body: |
            Auto-built **unsigned** IPA for sideloading on iOS.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`

            Download `cubechat-unsigned.ipa` below and sideload it with
            Sideloadly and a free Apple ID. Valid for 7 days, then re-install
            from a fresh build.
          files: build/ios/iphoneos/cubechat-unsigned.ipa

      - name: Upload IPA as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cubechat-ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/cubechat-unsigned.ipa
          # 7, not 30. This is a private repo, so artifact storage is a small
          # fixed allowance rather than the unlimited one public repos get, and
          # a 30-day window meant ~90 IPAs alive at once — 1.1 GB on its own,
          # which was still over the limit even after the far larger pile of
          # duplicate Android APKs was removed. A sideload is re-signed every
          # 7 days anyway, so an IPA older than that has nothing to offer.
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ iOS build succeeded"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Download:** the \`ipa-latest\` release →"
            echo "  \`${{ github.server_url }}/${{ github.repository }}/releases/tag/ipa-latest\`"
            echo ""
            echo "### How to install on iPhone (free Apple ID, 7-day re-sign)"
            echo "1. Download \`cubechat-unsigned.ipa\` from the release above"
            echo "2. Open Sideloadly on Windows, plug iPhone via USB"
            echo "3. Drag the IPA into Sideloadly, enter your free Apple ID, click Start"
            echo "4. On iPhone: Settings → General → VPN & Device Management → trust the new profile"
            echo "5. App is valid for 7 days, repeat to refresh"
          } >> "$GITHUB_STEP_SUMMARY"
