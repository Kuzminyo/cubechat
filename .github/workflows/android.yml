name: Android build (signed release APK for sideloading)

# Triggers:
# - every push to main (so each commit produces a fresh installable APK)
# - manual run from the Actions tab (Run workflow button)
#
# Add an active feature branch here to get APKs off it without merging to main
# first — and take it back out once it merges, or its pushes keep overwriting
# the apk-latest release with a build that isn't main's.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can upsert the rolling "apk-latest" prerelease that holds
# a directly-downloadable .apk link (nicer on a phone than a zipped artifact).
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    # Ubuntu runner ships the Android SDK and can reach dl.google.com, which the
    # sandboxed dev environment cannot — this is why the APK is built in CI.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pin Flutter to match the developer's local stable channel (same version
      # the iOS workflow uses).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      # Restore the release keystore from a secret, when there is one.
      #
      # The .jks is gitignored — a signing key in the repository is a signing
      # key for anyone who can read the repository — so CI gets it as a
      # base64 secret and writes it out for the length of the job. See the
      # fallback below for what happens when the secrets are not set.
      - name: Restore release keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CUBECHAT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret — falling back to a debug build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/cubechat-release.jks
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Signed with the same key as the developer's local release builds, so
      # this APK installs *over* one of those rather than being refused for a
      # signature mismatch — which is the whole point of building release here
      # instead of debug. build.gradle.kts already reads these four from the
      # environment (see `secret()`), so nothing needs threading through Gradle
      # by hand.
      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          CUBECHAT_RELEASE_STORE_FILE: cubechat-release.jks
          CUBECHAT_RELEASE_STORE_PASSWORD: ${{ secrets.CUBECHAT_RELEASE_STORE_PASSWORD }}
          CUBECHAT_RELEASE_KEY_ALIAS: ${{ secrets.CUBECHAT_RELEASE_KEY_ALIAS }}
          CUBECHAT_RELEASE_KEY_PASSWORD: ${{ secrets.CUBECHAT_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      # Without the secrets a --release build would come out unsigned and refuse
      # to install, so the job still produces something usable rather than
      # failing: a debug APK, self-signed with the Android debug keystore.
      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.available != 'true'
        run: flutter build apk --debug

      - name: Show build output
        run: |
          set -e
          echo "build/app/outputs/flutter-apk:"
          ls -lh build/app/outputs/flutter-apk/ || echo "(missing)"

      - name: Rename APK
        run: |
          set -e
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk cubechat.apk
            ls -lh cubechat.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk cubechat-debug.apk
            ls -lh cubechat-debug.apk
          fi

      # Deliberately NOT uploaded as a workflow artifact.
      #
      # The rolling release below already publishes this exact file, from a
      # stable URL that is nicer to open on a phone — so an artifact was a
      # second copy of an 88 MB APK on every push, kept for 30 days. That is
      # what exhausted the account's artifact storage: 73 of them had piled up
      # to 6.4 GB, against 1.1 GB for every iOS build ever made, and the first
      # thing it broke was the iOS job, which could build an IPA but no longer
      # had anywhere to put it.
      #
      # If a per-commit APK is ever wanted again, prefer shortening
      # retention-days over reinstating the duplicate.

      # Attach the APK to a rolling prerelease so there's a stable, direct
      # download URL that opens straight to install on a phone (no zip, no
      # digging through the Actions UI).
      - name: Publish to rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          # Only one of the two names below exists on any given run.
          fail_on_unmatched_files: false
          tag_name: apk-latest
          name: Latest APK (${{ github.ref_name }})
          prerelease: true
          body: |
            Auto-built APK for sideloading on Android
            (${{ steps.signing.outputs.available == 'true' && 'release, signed' || 'debug — no signing secrets set' }}).

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`

            Download the `.apk` below, open it on your Android phone, and allow
            "Install unknown apps" for your browser/file manager when prompted.
          files: |
            cubechat.apk
            cubechat-debug.apk

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Android build succeeded"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "### Download the APK"
            echo "- **Direct link (best on a phone):** the \`apk-latest\` release →"
            echo "  \`${{ github.server_url }}/${{ github.repository }}/releases/tag/apk-latest\`"
            echo ""
            echo "_No workflow artifact: the release above is the same file, and"
            echo "a second 88 MB copy per push is what filled the artifact quota._"
            echo ""
            echo "### Install on Android"
            echo "1. Open the download link on your phone"
            echo "2. Tap the \`.apk\`"
            echo "3. Allow \"Install unknown apps\" for your browser if prompted"
            echo "4. Install and open"
          } >> "$GITHUB_STEP_SUMMARY"
