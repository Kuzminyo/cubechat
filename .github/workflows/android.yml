name: Android build (release APK for sideloading)

# Triggers:
# - every push to main (so each commit produces a fresh installable APK)
# - manual run from the Actions tab (Run workflow button)
#
# Add an active feature branch here to get APKs off it without merging to main
# first — and take it back out once it merges, or its pushes keep overwriting
# the apk-latest release with a build that isn't main's.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can upsert the rolling "apk-latest" prerelease that holds
# a directly-downloadable .apk link (nicer on a phone than a zipped artifact).
permissions:
  contents: write

jobs:
  # Nothing was checked before a build was published. Both workflows compiled
  # whatever was on main and pushed it straight to a release, so a commit that
  # broke a test or stopped analysing cleanly shipped to testers exactly like a
  # good one — and the first anyone knew of it was the app misbehaving on a
  # phone.
  #
  # Gated on errors and warnings, not on lints. `flutter analyze` fails on any
  # issue at all by default, and the tree carries a few hundred style infos
  # (mostly missing trailing commas); making those block a build would mean the
  # gate is switched off within a day. --no-fatal-infos keeps it meaningful:
  # something has to actually be wrong for this to go red.
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      # `--no-fatal-infos` alone does NOT stop analyze exiting 1 — it still
      # fails on the several hundred style infos this tree carries. Only
      # `--no-fatal-warnings` silences the exit code, and that would throw away
      # real warnings along with the trailing commas. So both flags go in to get
      # a zero exit, and the severities we actually care about are read back out
      # of the output. (The separator differs by platform: "error -" locally on
      # Windows, "error •" on the Linux runner.)
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze.log
          if grep -qE '^[[:space:]]*(error|warning)[[:space:]]*[-•]' analyze.log; then
            echo "::error::flutter analyze reported errors or warnings"
            grep -E '^[[:space:]]*(error|warning)[[:space:]]*[-•]' analyze.log
            exit 1
          fi

      # Goldens excluded: they are pixel comparisons against PNGs recorded on
      # the developer's machine, and font rasterisation differs enough between
      # Windows and a Linux runner to fail them by ~3% of pixels every time.
      # That diff says nothing about the code, and re-recording here would just
      # move the failure to the machine the screens are actually designed on.
      - name: Test
        run: flutter test --exclude-tags golden

  build:
    name: Build release APK
    # No point spending a build, or publishing one, on a tree that fails its
    # own tests.
    needs: verify
    # Ubuntu runner ships the Android SDK and can reach dl.google.com, which the
    # sandboxed dev environment cannot — this is why the APK is built in CI.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pin Flutter to match the developer's local stable channel (same version
      # the iOS workflow uses).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pull pub dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      # Keep the sideload signing key across builds.
      #
      # Without this every run signs under a different identity, and Android
      # refuses to install an APK over one signed by a different key — so each
      # build demanded a full uninstall, losing the chats and the identity on
      # that device. Restored before the build; saved afterwards by the cache
      # action's own post step. If the cache is ever evicted (GitHub drops
      # entries untouched for a week) the next build mints a new key and that
      # one install has to be replaced by hand. The secrets below end that for
      # good.
      - name: Restore the sideload signing key
        uses: actions/cache@v4
        with:
          path: ~/.cubechat-signing
          key: cubechat-sideload-keystore-v2

      # Never the debug keystore — that is what Play Protect was reading.
      #
      # Letting Gradle fall back to ~/.android/debug.keystore signs the APK as
      # `CN=Android Debug, O=Android, C=US`: the fixed, universally known
      # identity every Android SDK on earth generates. Play Protect treats it
      # as exactly the signal it is — an app nobody stands behind — and blocks
      # the install outright with "Play Protect has never seen an app from this
      # developer", which is not a signing failure and cannot be fixed by
      # signing harder.
      #
      # So the fallback key is a real one, generated here on first use and
      # cached: same self-signed status, but under cubechat's own name rather
      # than the SDK's placeholder. The password is deliberately in the clear —
      # it protects a keystore that lives only in this repository's Actions
      # cache, and pretending otherwise would just make it harder to rebuild.
      #
      # When CUBECHAT_RELEASE_KEYSTORE_BASE64 and its passwords exist as
      # repository secrets, that key wins instead and never changes.
      - name: Provide a signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CUBECHAT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "store=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
            exit 0
          fi

          dir="$HOME/.cubechat-signing"
          store="$dir/sideload.jks"
          pass="cubechat-sideload"
          mkdir -p "$dir"
          if [ ! -f "$store" ]; then
            echo "No cached sideload key — generating one."
            keytool -genkeypair -noprompt \
              -keystore "$store" -storetype PKCS12 \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -alias cubechat \
              -storepass "$pass" -keypass "$pass" \
              -dname "CN=cubechat, O=cubechat, C=UA"
          else
            echo "Reusing the cached sideload key."
          fi
          echo "store=$store" >> "$GITHUB_OUTPUT"
          echo "store_pass=$pass" >> "$GITHUB_OUTPUT"

      # Release, not debug. This used to build --debug because an unsigned
      # release APK will not install, and no release signing secrets are wired
      # into this workflow — but the answer to that was the signing config, not
      # the build type. app/build.gradle.kts now falls back to the debug
      # keystore when CUBECHAT_RELEASE_* / key.properties are absent, so the
      # release build comes out installable.
      #
      # It matters more than it sounds. A debug APK runs Dart through the
      # interpreter with assertions live, so it is both the slowest build the
      # project can produce and the one whose frame times mean the least — and
      # the app has a diagnostics screen that reports exactly those numbers.
      # Testers were reading a debugger's performance and calling it the app's.
      # Per-ABI first, then the universal one.
      #
      # The universal APK carries native code for arm64, arm32 and x86_64 at
      # once, and a phone runs exactly one of them — so two thirds of an 83 MB
      # download is machine code that device will never execute. Over a mobile
      # connection that is a long transfer with plenty of chances to break, and
      # a half-downloaded APK does not announce itself as one; it just fails to
      # install. The arm64 slice is about a third of the size and is what every
      # phone made in the last decade actually wants.
      #
      # The universal build stays as the fallback for anything unusual, so
      # picking wrong is recoverable rather than a dead end.
      - name: Build release APKs
        env:
          CUBECHAT_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store }}
          # The generated fallback supplies its own password/alias; the secrets
          # take over untouched when they are set.
          CUBECHAT_RELEASE_STORE_PASSWORD: ${{ secrets.CUBECHAT_RELEASE_STORE_PASSWORD || steps.signing.outputs.store_pass }}
          CUBECHAT_RELEASE_KEY_ALIAS: ${{ secrets.CUBECHAT_RELEASE_KEY_ALIAS || 'cubechat' }}
          CUBECHAT_RELEASE_KEY_PASSWORD: ${{ secrets.CUBECHAT_RELEASE_KEY_PASSWORD || steps.signing.outputs.store_pass }}
          # Gradle reads this through `secret()`, which falls back to the
          # environment. Locally it comes from local.properties, which is not in
          # the repository — so every APK CI has ever published shipped with an
          # empty key and a map that draws nothing but the Google logo. That is
          # the "black map on some phones": the phones with the release build.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::GOOGLE_MAPS_API_KEY secret is empty — the map would build black"
            exit 1
          fi
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Show build output
        run: |
          set -e
          echo "build/app/outputs/flutter-apk:"
          ls -lh build/app/outputs/flutter-apk/ || echo "(missing)"

      - name: Rename APKs
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk cubechat-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk cubechat-arm32.apk
          cp build/app/outputs/flutter-apk/app-release.apk cubechat-universal.apk
          ls -lh cubechat-arm64.apk cubechat-arm32.apk cubechat-universal.apk

      # Which key signed this build, in one line. "App not installed" almost
      # always means the signer changed since the copy on the phone, and that
      # is invisible from the APK's version or its size — so the fingerprint
      # goes in the release notes, where it can be compared against the last
      # build before anyone starts guessing.
      - name: Read the signing fingerprint
        id: cert
        run: |
          set -e
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          fp=$("$signer" verify --print-certs cubechat-arm64.apk \
                | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          subject=$("$signer" verify --print-certs cubechat-arm64.apk \
                | grep -m1 'certificate DN' | cut -d: -f2- | sed 's/^ //')
          echo "fingerprint=${fp:-unknown}" >> "$GITHUB_OUTPUT"
          echo "subject=${subject:-unknown}" >> "$GITHUB_OUTPUT"
          echo "signed by: $subject"
          echo "SHA-256:   $fp"

      # Deliberately NOT uploaded as a workflow artifact.
      #
      # The rolling release below already publishes this exact file, from a
      # stable URL that is nicer to open on a phone — so an artifact was a
      # second copy of an 88 MB APK on every push, kept for 30 days. That is
      # what exhausted the account's artifact storage: 73 of them had piled up
      # to 6.4 GB, against 1.1 GB for every iOS build ever made, and the first
      # thing it broke was the iOS job, which could build an IPA but no longer
      # had anywhere to put it.
      #
      # If a per-commit APK is ever wanted again, prefer shortening
      # retention-days over reinstating the duplicate.

      # Attach the APK to a rolling prerelease so there's a stable, direct
      # download URL that opens straight to install on a phone (no zip, no
      # digging through the Actions UI).
      - name: Publish to rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Latest release APK (${{ github.ref_name }})
          prerelease: true
          body: |
            Auto-built **release** APK for sideloading on Android.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`

            **Take `cubechat-arm64.apk`** — every phone made in roughly the
            last decade is arm64, and it is a third the size of the universal
            build, which matters over mobile data. Open it on the phone and
            allow "Install unknown apps" for your browser or file manager when
            prompted.

            The others are fallbacks: `cubechat-arm32.apk` for old 32-bit
            devices, `cubechat-universal.apk` if neither installs.

            **Signed by:** `${{ steps.cert.outputs.subject }}`
            **Key SHA-256:** `${{ steps.cert.outputs.fingerprint }}`

            If that fingerprint differs from the build currently on your phone,
            Android will refuse to install this one over it ("App not
            installed") — uninstall cubechat first, then install this APK. When
            the fingerprint matches, it installs straight over the top and
            keeps your chats.
          files: |
            cubechat-arm64.apk
            cubechat-arm32.apk
            cubechat-universal.apk

      # Publishing under new filenames leaves the previous ones sitting next to
      # them — APKs from an unrelated commit, offered on the same page as the
      # current build. Anything on the tag that this run did not just upload is
      # stale by definition, so it goes.
      - name: Drop superseded assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="cubechat-arm64.apk cubechat-arm32.apk cubechat-universal.apk"
          gh api "repos/${{ github.repository }}/releases/tags/apk-latest" \
            --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case " $keep " in
                *" $name "*) ;;
                *)
                  gh api -X DELETE \
                    "repos/${{ github.repository }}/releases/assets/$id" \
                    && echo "removed stale $name"
                  ;;
              esac
            done

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Android build succeeded"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "### Download the APK"
            echo "- **Direct link (best on a phone):** the \`apk-latest\` release →"
            echo "  \`${{ github.server_url }}/${{ github.repository }}/releases/tag/apk-latest\`"
            echo ""
            echo "_No workflow artifact: the release above is the same file, and"
            echo "a second copy per push is what filled the artifact quota._"
            echo ""
            echo "### Install on Android"
            echo "1. Open the download link on your phone"
            echo "2. Tap \`cubechat-arm64.apk\` (universal build is the fallback)"
            echo "3. Allow \"Install unknown apps\" for your browser if prompted"
            echo "4. Install and open"
            echo ""
            echo "**Signed by:** \`${{ steps.cert.outputs.subject }}\`"
            echo ""
            echo "**Key SHA-256:** \`${{ steps.cert.outputs.fingerprint }}\`"
            echo ""
            echo "If that differs from the build on the phone, uninstall"
            echo "cubechat first — Android will not install over a different"
            echo "signing key."
          } >> "$GITHUB_STEP_SUMMARY"
