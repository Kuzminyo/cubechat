name: Landing site

# The marketing site in `landing/`, published to GitHub Pages.
#
# Only on changes to that directory, plus manual dispatch. The app and the
# landing page share a repository and nothing else: an APK build has no reason
# to redeploy a website, and a copy edit on the website has no reason to spend
# a macOS runner.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs both: `pages` to deploy, `id-token` for the deployment's own
# attestation. `contents: read` stays least-privilege — nothing here writes to
# the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one is not cancelled: the last push
# should win, and cancelling in-progress would leave whichever finished first
# as the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lock file says
      # and fails if the two disagree, which is the difference between a build
      # that reproduces and one that merely succeeds.
      - name: Install
        working-directory: landing
        run: npm ci

      # No PAGES_BASE any more: on cubechat.tech the site is the whole origin,
      # so the base is `/`, which is what vite.config.ts falls back to.
      #
      # It was `/cubechat/` while the site lived at kuzminyo.github.io/cubechat/
      # — inside a folder, where a base of `/` gives a page whose HTML loads and
      # whose every asset 404s. If the custom domain is ever removed, that line
      # has to come back with it; the two are one decision, not two.
      #
      # The domain itself is landing/public/CNAME. Pages reads it from the
      # deployed site rather than from settings, so it survives a redeploy and
      # lives in version control where it can be reviewed.
      - name: Build
        working-directory: landing
        run: npm run build

      # Pages has to be enabled on the repository once, by hand, and this step
      # only reads that configuration.
      #
      # `enablement: true` was tried here and cannot work: creating a Pages site
      # is an administrative action, and the workflow token does not have it —
      # "Create Pages site failed. Resource not accessible by integration".
      # Granting it would mean a personal access token stored as a secret, which
      # is a standing key to the repository's settings in exchange for saving
      # one click, once.
      #
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: |
          {
            echo "## Landing site deployed"
            echo ""
            echo "- ${{ steps.deploy.outputs.page_url }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> $GITHUB_STEP_SUMMARY
