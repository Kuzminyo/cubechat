##
## cubechat's media relay: the second strfry, behind /media. See the "Separate
## media inbox" section of relay/README.md for why it is a process and a
## database of its own rather than a path to the first one.
##

db = "/opt/cubechat-media-relay/strfry-db/"

dbParams {
    # A ceiling, not an allocation: LMDB grows into its map rather than
    # reserving it. 10 GB rather than the root relay's 16: the two maps share
    # one 24 GB disk (21 free when the root relay went in), and a map larger
    # than what the filesystem can still give is a promise the kernel cannot
    # keep — the failure lands as a write error in the middle of a transfer.
    # Media moves here from the root relay, whose own share shrinks as its
    # fortnight of old chunks expires. Retention below is what bounds the size;
    # this is the backstop.
    maxreaders = 256
    mapsize = 10737418240
}

relay {
    # Behind Caddy, which holds the certificate and the public name. Bound to
    # loopback so the only way in is through it — a relay listening on the
    # public interface would also be reachable without TLS, and by anyone
    # scanning the address.
    bind = "127.0.0.1"
    port = 8082

    # Kind 1059 reads require AUTH in this strfry version. On 2026-09-10
    # a valid proof was rejected because the default serviceUrl was empty.
    #
    # The host root, the same as the root relay. The app signs its proof with
    # the socket's full URL (…/media), and the root relay has been accepting
    # exactly those for /geo and /media since 2026-09-10 — 1094's own log shows
    # "relay.cubechat.tech/media authenticated". That is the value known to
    # work; a new one would be the only untested line in this file.
    auth {
        enabled = true
        serviceUrl = "wss://relay.cubechat.tech"
        restrictedReadKinds = "4, 1059"
        restrictReadToInvolvedPubkey = true
    }

    # Sent to a client that asks how much it may do at once.
    nofiles = 65536

    realIpHeader = "x-forwarded-for"

    info {
        name = "cubechat media"
        description = "The media lane for cubechat. Gift-wrapped frames only."
        pubkey = ""
        contact = "cubechatble@gmail.com"
    }

    # One media chunk is 32 KiB of ciphertext, which is about 44 KB once it is
    # base64 in an event's content, plus tags and the envelope. 128 KB leaves
    # room for that and refuses anything that is plainly not one of ours.
    maxWebsocketPayloadSize = 131072

    # A phone that has been offline for a week asks for a lot at once, and a
    # media transfer is hundreds of events in a row. The defaults here are
    # tuned for a public relay serving strangers; ours serves a handful of
    # phones that each have a real reason to be asking.
    maxReqFilterSize = 500
    maxSubsPerConnection = 40

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 1
        negentropy = 1
    }
}

events {
    # 128 KB, matching the socket limit above. An event larger than one media
    # chunk is not something this relay carries for anybody.
    maxEventSize = 131072

    # A gift wrap carries one `#p` and one `#w`. Twenty is generous and still
    # refuses a tag-stuffed event built to make indexing expensive.
    maxNumTags = 20
    maxTagValSize = 1024

    # A clock a day out is a clock that is wrong, and an event dated into the
    # future sorts above everything real for as long as it is stored.
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 7776000

    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
}

##
## What actually bounds the disk.
##
## A chunk only has to survive long enough for the other phone to come online
## and ask for it — a fortnight covers a holiday. Everything else goes at a
## week, which is already longer than the store-and-forward window the mesh
## keeps.
##
## This is the one line that made strfry the choice: a relay carrying media
## fills a disk, and expiring it here means no cron job of ours to forget.
##
retention = [
    { kinds = [1059], time = 1209600 },
    { time = 604800 }
]
