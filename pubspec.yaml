name: cubechat
description: Encrypted peer-to-peer messaging over Bluetooth mesh.
publish_to: 'none'
version: 1.0.0+1019

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1

  # UI
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  qr_code_dart_scan: ^0.12.1

  # Storage
  shared_preferences: ^2.3.2

  # BLE transport (M1)
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # Crypto (M2)
  cryptography: ^2.7.0            # X25519, ChaCha20-Poly1305, BLAKE2s, HKDF
  flutter_secure_storage: ^9.2.2  # private key in Keychain / Keystore

  # Nostr internet fallback (M6) — relay sockets. secp256k1/BIP-340 is
  # implemented in-repo (lib/core/crypto/secp256k1.dart), so no crypto dep.
  web_socket_channel: ^3.0.3

  # Persistence (M4)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Telegram-style gallery: custom device-photo grid picker (multi-select),
  # plus save-to-gallery and share from the in-chat media viewer. (Replaced the
  # one-shot image_picker.)
  photo_manager: ^3.6.0
  share_plus: ^10.1.4
  saver_gallery: ^4.0.1

  # Location sharing: the fix itself, and the way out to a map.
  #
  # No map SDK, deliberately. Drawing tiles means asking a tile server for the
  # square the user is standing in — handing their position to a third party is
  # precisely what this app exists not to do — so a shared location opens in the
  # phone's own maps app instead, where the user already made that choice.
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Voice messages (audio capture + playback)
  record: ^6.0.0
  audioplayers: ^6.1.0

  # Local notifications (incoming-message alerts)
  flutter_local_notifications: ^17.2.3
  flutter_native_splash: ^2.4.1

  # Attach an arbitrary file. Only the document picker — the photo path keeps
  # using photo_manager, whose grid is the one the chat already shows.
  file_picker: ^8.1.4

  # Take-a-photo-to-send: in-app camera capture screen.
  #
  # **Do not add `camera_android` beside this.** It was tried in build 1012 as
  # a "use the old Camera2 API" setting, the way Telegram ships one, and it
  # broke every camera in the app on Android. Flutter allows exactly one
  # implementation of a platform interface per platform: `camera_android`
  # declares `implements: camera`, so as a direct dependency it *displaces*
  # `camera_android_camerax` — which is the plugin's own `default_package` —
  # and the displaced one is dropped from `.flutter-plugins-dependencies`
  # entirely. Its Android module is then never built and its plugin class
  # never registered, so pointing `CameraPlatform.instance` back at CameraX at
  # runtime reaches channels with nothing on the other end:
  #
  #   PlatformException(channel-error, Unable to establish connection on
  #   channel: "dev.flutter.pigeon.camera_android_camerax.
  #   ProcessCameraProvider.getInstance")
  #
  # Which camera Android uses is a **build-time** choice, not a setting. A
  # native app can carry both and pick at runtime; a Flutter app cannot, and no
  # amount of registration code changes that, because the losing plugin's Java
  # is not in the APK to register.
  camera: ^0.12.0+2
  # JPEG re-encode/downscale of camera & edited bytes to the BLE mesh budget
  # (the gallery path downscales natively via photo_manager instead), and the
  # encoder our own photo editor exports through. The editor used to be
  # `pro_image_editor`; it is now `lib/features/chat/presentation/editor/`.
  #
  # Icons come from Flutter's own `Icons.*` and nowhere else. `material_symbols_icons`
  # was tried and taken back out: its glyphs did not draw on a real phone in any
  # build, and it is 32 MB of variable fonts for the fourteen marks this app uses.
  image: ^4.8.0
  open_filex: ^4.7.0
  flutter_displaymode: ^0.7.0
  flutter_map: 8.3.1
  latlong2: 0.10.1
  geocoding: ^5.0.0
  flutter_map_cache: ^1.5.2
  dio_cache_interceptor_file_store: ^1.2.3
  google_maps_flutter: ^2.18.0
  # Direct, not transitive: the Android platform view has to be told to render
  # in hybrid composition, and that switch lives on the Android implementation.
  # See PeopleMapScreen.initState.
  google_maps_flutter_android: ^2.18.0
  google_maps_flutter_platform_interface: ^2.16.0
  # Playing a clip where it sits: a video from the gallery, and a circle.
  # Both are local files by the time they reach a bubble — nothing here ever
  # streams from a URL, and no player is built for a message off screen.
  video_player: ^2.11.1
  # Which circle is actually on screen.
  #
  # Circles play by themselves, the way they do in every messenger that has
  # them, and "by itself" has to mean *the one you are looking at*. A list
  # builds its neighbours as well as its visible rows, so starting playback in
  # `initState` runs three videos at once — two of them off screen, all three
  # holding a platform decoder. Flutter has no built-in way to ask "is this on
  # screen", and this is Google's answer to that.
  visibility_detector: ^0.4.0+2

# CameraX must mirror the encoded front-camera clip as well as its preview.
# The small native patch is documented in third_party/camera_android_camerax.
dependency_overrides:
  camera_android_camerax:
    path: third_party/camera_android_camerax
  camera_avfoundation:
    path: third_party/camera_avfoundation

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # Already present transitively via flutter_test; declared so the idle-signal
  # tests can drive its timers without leaning on an undeclared package.
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
    - assets/stickers/
    - .codex/fonts/


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo/cube.png
  background_color_ios: "#06140D"
  adaptive_icon_background: "#06140D"
  adaptive_icon_foreground: assets/logo/cube_transparent.png

flutter_native_splash:
  color: "#06140D"
  image: assets/logo/cube.png
  android: true
  ios: true
  android_12:
    color: "#06140D"
    image: assets/logo/cube.png
    icon_background_color: "#06140D"
