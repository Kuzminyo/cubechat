# Journal retention for the cubechat doorbell.
#
# Install as /etc/systemd/journald.conf.d/cubechat.conf
#
# The service writes a line per event, and each one names a person:
#
#   [wake] a1b2c3d4 has mail
#   [apns] a1b2c3d4 -> production: 200
#
# Eight characters of an npub with a timestamp beside it. That is enough to
# link one person's entries across days and build a record of who received
# mail and when — for as long as the journal keeps it, which by default is
# until the disk fills.
#
# The app tells its users what the doorbell costs them: the server learns that
# a given npub received something, and when. It learns it. Nothing promised
# that it would write it down forever, and a service that holds no key should
# not be quietly accumulating the one thing it can see.
#
# Three days is the window a bug report needs. Every diagnosis this service has
# been through was answered by log lines minutes to hours old, never days, and
# a report that arrives a week later is answered by reproducing it rather than
# by reading history nobody should be keeping.
#
# 100M is a ceiling under the retention, not instead of it: whichever comes
# first wins, so a burst cannot outrun the time limit.
[Journal]
SystemMaxUse=100M
MaxRetentionSec=3day
