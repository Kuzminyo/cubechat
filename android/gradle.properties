org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some plugins (e.g. photo_manager) default their Kotlin JVM target to the JDK's
# (21) while their Java stays at 17, tripping Gradle's consistency check. The
# mixed targets dex fine for Android, so relax the check to a warning.
kotlin.jvm.target.validation.mode=warning
# opus_flutter_android still declares minSdk 19 and builds libopus with the
# NDK, and NDK 27 builds nothing below API 21 - it refuses to configure. The
# app's own floor is 24, so the library never runs anywhere 21 would matter.
android.ndk.suppressMinSdkVersionError=21
